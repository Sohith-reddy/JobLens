services:
  - type: web
    name: joblens-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RENDER_EXTERNAL_URL
        sync: false        # You'll fill this after first deploy
      - key: PORT
        value: 8000